# Supabase free projects pause after 7 days without activity. This pings the database once a day.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/public_config" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase is awake"
